# Claude Code の Remote Control を Docker の中で動かす。使い方は同じフォルダの README.md
name: svwb-rc
services:
  rc:
    build:
      context: .
      args:
        USER_UID: ${SVWB_UID:-1000}
        USER_GID: ${SVWB_GID:-1000}
    image: svwb-rc
    container_name: svwb-rc
    # Remote Control のセッション名の頭（svwb-docker-…）になる。ホストで動かすものと見分けるため
    hostname: svwb-docker
    init: true
    # claude remote-control は最初の確認（フォルダの信頼など）に端末が要る。答えを覚えた後も端末があれば困らない
    tty: true
    stdin_open: true
    # claude remote-control は下の command の中で立ち上げ直す。これはそのほかで止まったとき（PC の再起動の後など）のため
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      # リポジトリ（このファイルの 2 つ上）をコンテナの /workspace に見せる。Claude が触れるのはこことコンテナの中だけ
      - ../..:/workspace
      # ログイン情報と設定
      - claude-config:/home/wk/.claude
      # Rust のビルド結果はホストと分ける（ホストで作ったものとコンテナで作ったものが混ざらないように）
      - rust-target:/workspace/rust/target
      # 自己対戦・モデル・ログなどの置き場所（ホストの ~/svwb-data）を、コンテナでも同じ ~/svwb-data に見せる。
      # リポジトリの外に置くので git clean などで消えない。無いと起動しないので、先に mkdir -p ~/svwb-data しておく
      - type: bind
        source: ${SVWB_DATA:-${HOME}/svwb-data}
        target: /home/wk/svwb-data
        bind:
          create_host_path: false
    # claude remote-control が終わっても（ネットワークが 10 分ほど切れた等）、コンテナは止めずに中で立ち上げ直す。
    # コンテナが止まると、中で動いている夜のキュー（npm run night。docs/night.md）も止まるため
    command:
      - bash
      - -c
      - |
        while :; do
          claude remote-control --permission-mode "$$CLAUDE_PERMISSION_MODE" --spawn "$$CLAUDE_SPAWN"
          echo "claude remote-control が終わりました（終わりの状態 $$?）。30 秒後に立ち上げ直します" >&2
          sleep 30
        done
    environment:
      CLAUDE_PERMISSION_MODE: ${CLAUDE_PERMISSION_MODE:-acceptEdits}
      CLAUDE_SPAWN: ${CLAUDE_SPAWN:-same-dir}

volumes:
  claude-config:
  rust-target:
